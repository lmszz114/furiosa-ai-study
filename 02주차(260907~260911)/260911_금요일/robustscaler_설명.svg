<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="720" height="560" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">RobustScaler = 중앙값과 IQR로 스케일링</text>

  <!-- 데이터 정렬 -->
  <text x="40" y="80" font-size="15" fill="#555">데이터를 크기순으로 정렬하고 4등분한다</text>

  <!-- number line -->
  <line x1="60" y1="140" x2="660" y2="140" stroke="#333" stroke-width="2"/>
  <!-- ticks: 값들 -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <line x1="90" y1="134" x2="90" y2="146" stroke="#333" stroke-width="2"/><text x="90" y="165">2</text>
    <line x1="170" y1="134" x2="170" y2="146" stroke="#333" stroke-width="2"/><text x="170" y="165">4</text>
    <line x1="250" y1="134" x2="250" y2="146" stroke="#333" stroke-width="2"/><text x="250" y="165">5</text>
    <line x1="330" y1="134" x2="330" y2="146" stroke="#333" stroke-width="2"/><text x="330" y="165">6</text>
    <line x1="410" y1="134" x2="410" y2="146" stroke="#333" stroke-width="2"/><text x="410" y="165">7</text>
    <line x1="490" y1="134" x2="490" y2="146" stroke="#333" stroke-width="2"/><text x="490" y="165">8</text>
    <line x1="630" y1="134" x2="630" y2="146" stroke="#c00" stroke-width="2"/><text x="630" y="165" fill="#c00" font-weight="bold">100</text>
  </g>
  <text x="630" y="118" text-anchor="middle" font-size="12" fill="#c00" font-weight="bold">← 이상치</text>

  <!-- Q1, median, Q3 markers -->
  <g>
    <!-- Q1 at 170 -->
    <line x1="170" y1="95" x2="170" y2="200" stroke="#2a7" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="170" y="90" text-anchor="middle" font-size="13" fill="#2a7" font-weight="bold">Q1 = 4</text>
    <!-- median at 330 -->
    <line x1="330" y1="95" x2="330" y2="210" stroke="#06c" stroke-width="3"/>
    <text x="330" y="90" text-anchor="middle" font-size="14" fill="#06c" font-weight="bold">중앙값 = 6</text>
    <!-- Q3 at 490 -->
    <line x1="490" y1="95" x2="490" y2="200" stroke="#2a7" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="490" y="90" text-anchor="middle" font-size="13" fill="#2a7" font-weight="bold">Q3 = 8</text>
  </g>

  <!-- IQR bracket -->
  <line x1="170" y1="225" x2="490" y2="225" stroke="#e80" stroke-width="2"/>
  <line x1="170" y1="219" x2="170" y2="231" stroke="#e80" stroke-width="2"/>
  <line x1="490" y1="219" x2="490" y2="231" stroke="#e80" stroke-width="2"/>
  <text x="330" y="246" text-anchor="middle" font-size="14" fill="#e80" font-weight="bold">IQR = Q3 − Q1 = 8 − 4 = 4</text>
  <text x="330" y="266" text-anchor="middle" font-size="12" fill="#888">(가운데 50% 구간의 폭)</text>

  <!-- key point box -->
  <rect x="60" y="292" width="600" height="70" rx="8" fill="#eef6ff" stroke="#06c"/>
  <text x="75" y="318" font-size="14" fill="#06c" font-weight="bold">핵심:</text>
  <text x="75" y="340" font-size="13.5" fill="#333">이상치 100이 있어도 중앙값(6)과 IQR(4)은 거의 안 변한다.</text>
  <text x="75" y="356" font-size="13.5" fill="#333">→ 평균·표준편차와 달리 극단값에 휘둘리지 않아 "이상치에 강하다".</text>

  <!-- formula -->
  <text x="60" y="398" font-size="15" fill="#555">변환 공식 (각 값에 적용):</text>
  <rect x="60" y="410" width="600" height="54" rx="8" fill="#f5f5f5" stroke="#bbb"/>
  <text x="360" y="444" text-anchor="middle" font-size="17" fill="#222">변환값 = (원값 − 중앙값) ÷ IQR = (원값 − 6) ÷ 4</text>

  <!-- examples -->
  <g font-size="13.5" fill="#333">
    <text x="60" y="494" font-weight="bold" fill="#555">예시:</text>
    <text x="75" y="516">· 원값 6 (중앙값)  → (6 − 6) ÷ 4 = <tspan font-weight="bold">0</tspan>   (가운데라서 0)</text>
    <text x="75" y="536">· 원값 8 (Q3)      → (8 − 6) ÷ 4 = <tspan font-weight="bold">0.5</tspan></text>
    <text x="400" y="516">· 원값 4 (Q1)  → (4 − 6) ÷ 4 = <tspan font-weight="bold">-0.5</tspan></text>
    <text x="400" y="536">· 원값 100     → (100 − 6) ÷ 4 = <tspan font-weight="bold">23.5</tspan> (이상치는 멀리)</text>
  </g>
</svg>
