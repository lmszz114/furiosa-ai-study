<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="620" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">러닝레이트 = weight를 움직이는 "보폭"</text>
  <text x="380" y="58" text-anchor="middle" font-size="13.5" fill="#777">loss–weight 그래프(U자)에서 바닥(최소 loss)을 찾아 내려간다</text>

  <!-- ===== 공통 축 설명 ===== -->
  <text x="380" y="86" text-anchor="middle" font-size="12.5" fill="#999">가로축 = weight · 세로축 = loss · ★ = 목표(최소 loss 지점)</text>

  <!-- ============ 패널 1: 너무 큼 ============ -->
  <g transform="translate(20,110)">
    <text x="110" y="0" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">너무 크면</text>
    <!-- U curve -->
    <path d="M 20 40 Q 110 210 200 40" fill="none" stroke="#bbb" stroke-width="2.5"/>
    <!-- target star at bottom -->
    <text x="110" y="185" text-anchor="middle" font-size="16" fill="#e8a020">★</text>
    <!-- bouncing arrows (overshoot) -->
    <path d="M 40 92 Q 110 -10 185 95" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#red)"/>
    <path d="M 180 100 Q 110 250 55 130" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#red)"/>
    <circle cx="40" cy="92" r="4" fill="#c0392b"/>
    <text x="110" y="235" text-anchor="middle" font-size="12" fill="#c0392b">바닥을 지나쳐 튕김 → 발산</text>
  </g>

  <!-- ============ 패널 2: 너무 작음 ============ -->
  <g transform="translate(275,110)">
    <text x="110" y="0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2471a3">너무 작으면</text>
    <path d="M 20 40 Q 110 210 200 40" fill="none" stroke="#bbb" stroke-width="2.5"/>
    <text x="110" y="185" text-anchor="middle" font-size="16" fill="#e8a020">★</text>
    <!-- tiny steps down the slope -->
    <g fill="#2471a3">
      <circle cx="40" cy="92" r="3.5"/>
      <circle cx="52" cy="112" r="3.5"/>
      <circle cx="64" cy="130" r="3.5"/>
      <circle cx="77" cy="146" r="3.5"/>
      <circle cx="90" cy="158" r="3.5"/>
    </g>
    <path d="M 40 92 L 52 112 L 64 130 L 77 146 L 90 158" fill="none" stroke="#2471a3" stroke-width="1.6" stroke-dasharray="2 2"/>
    <text x="110" y="235" text-anchor="middle" font-size="12" fill="#2471a3">조금씩만 이동 → 매우 느림</text>
  </g>

  <!-- ============ 패널 3: 적당함 ============ -->
  <g transform="translate(530,110)">
    <text x="110" y="0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">적당하면</text>
    <path d="M 20 40 Q 110 210 200 40" fill="none" stroke="#bbb" stroke-width="2.5"/>
    <text x="110" y="185" text-anchor="middle" font-size="16" fill="#e8a020">★</text>
    <!-- a few good steps landing near bottom -->
    <g fill="#1e8449">
      <circle cx="40" cy="92" r="4"/>
      <circle cx="70" cy="140" r="4"/>
      <circle cx="100" cy="165" r="4"/>
      <circle cx="110" cy="172" r="4"/>
    </g>
    <path d="M 40 92 L 70 140 L 100 165 L 110 172" fill="none" stroke="#1e8449" stroke-width="1.8" marker-end="url(#green)"/>
    <text x="110" y="235" text-anchor="middle" font-size="12" fill="#1e8449">알맞은 보폭 → 바닥에 잘 도착</text>
  </g>

  <!-- markers -->
  <defs>
    <marker id="red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1e8449"/></marker>
  </defs>

  <!-- ===== 하단 설명 박스 ===== -->
  <rect x="40" y="405" width="680" height="86" rx="10" fill="#eef6ff" stroke="#3b7"/>
  <text x="60" y="432" font-size="14.5" fill="#1e8449" font-weight="bold">한 줄 정리</text>
  <text x="60" y="457" font-size="13.5" fill="#333">러닝레이트 = weight를 한 번에 얼마나 크게 움직일지(보폭). 산 골짜기를 내려가듯</text>
  <text x="60" y="477" font-size="13.5" fill="#333">최소 loss(바닥)를 찾는다. 너무 크면 튕겨 발산, 너무 작으면 느림, 적당해야 잘 도착.</text>

  <!-- ===== U자 이유 ===== -->
  <rect x="40" y="507" width="680" height="86" rx="10" fill="#f5f5f5" stroke="#bbb"/>
  <text x="60" y="534" font-size="14.5" fill="#555" font-weight="bold">그래프가 U자인 이유</text>
  <text x="60" y="559" font-size="13.5" fill="#333">loss(mse) = (실제값 − 예측값)² 로 <tspan font-weight="bold">제곱(2차함수)</tspan>이라, weight에 대한 그래프가</text>
  <text x="60" y="579" font-size="13.5" fill="#333">포물선(U자)이 된다. 최적 weight에서 loss가 최소(바닥)가 된다.</text>
</svg>
